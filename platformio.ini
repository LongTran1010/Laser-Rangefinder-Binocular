; PlatformIO Project Configuration File
[platformio]
default_envs = tc22_bench

[env_base]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder
build_flags =
    -DCURRENT_FW_VERSION="\"1.0.2\""
lib_deps =
    ArduinoJson
    knolleary/PubSubClient @ 2.8
    HTTPClient
    WiFi
    adafruit/Adafruit GFX Library@^1.12.2
    adafruit/Adafruit ILI9341
    espressif/WROVER KIT LCD@^1.0.3

; ===== sensor modes =====
[env:fake]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DFAKE_MODE
    -DENABLE_MQTT_LOG=0
    -DUSE_BUTTON=0

[env:tf02_bench]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DUSE_TF02_PRO
    -DENABLE_MQTT_LOG=1
    -DUSE_BUTTON=0

[env:tf02_release]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DUSE_TF02_PRO
    -DENABLE_MQTT_LOG=0
    -DUSE_BUTTON=1

; ===== TC22 benchmark variants =====
[env_tc22_common]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DUSE_TC22
    -DENABLE_MQTT_LOG=1
    -DUSE_BUTTON=0
    -DMQTT_MAX_PACKET_SIZE=1024

; Default benchmark = alpha-beta D_AB_BALANCED
[env:tc22_bench]
extends = env_tc22_common
build_flags =
    ${env_tc22_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=3
    -DTEST_ID=8003

; Baseline (Gating + Median + EMA) cho A/B
[env:tc22_baseline]
extends = env_tc22_common
build_flags =
    ${env_tc22_common.build_flags}
    -DESTIMATOR_MODE=EST_BASELINE
    -DTEST_ID=8002

; Raw pass-through cho fair offline benchmark (D1)
[env:tc22_raw]
extends = env_tc22_common
build_flags =
    ${env_tc22_common.build_flags}
    -DESTIMATOR_MODE=EST_RAW_ONLY
    -DTEST_ID=8001

; Alpha-beta variants
[env:tc22_ab_light]
extends = env_tc22_common
build_flags =
    ${env_tc22_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=2
    -DTEST_ID=2002

[env:tc22_ab_aggressive]
extends = env_tc22_common
build_flags =
    ${env_tc22_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=4
    -DTEST_ID=2004

[env:tc22_ab_handheld]
extends = env_tc22_common
build_flags =
    ${env_tc22_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=5
    -DTEST_ID=2005

[env:tc22_release]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DUSE_TC22
    -DENABLE_MQTT_LOG=0
    -DUSE_BUTTON=1
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=3
