; PlatformIO Project Configuration File
[platformio]
default_envs = tc22_daily

[env_base]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder
build_flags =
    ; Fix #13 v2: bump version voi UX v2 (button + preset + NVS + fixes regression).
    -DCURRENT_FW_VERSION="\"1.2.3-UX-v2\""
lib_deps =
    ArduinoJson
    knolleary/PubSubClient @ 2.8
    HTTPClient
    WiFi
    adafruit/Adafruit GFX Library@^1.12.2
    adafruit/Adafruit ILI9341
    espressif/WROVER KIT LCD@^1.0.3

; ===== sensor modes =====
[env:fake]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DFAKE_MODE
    -DENABLE_MQTT_LOG=0

[env:tf02_bench]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DUSE_TF02_PRO
    -DENABLE_MQTT_LOG=1

[env:tf02_release]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DUSE_TF02_PRO
    -DENABLE_MQTT_LOG=0

; ===== TC22 benchmark variants =====
[env_tc22_common]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DUSE_TC22
    -DENABLE_MQTT_LOG=1
    -DMQTT_MAX_PACKET_SIZE=1024

; Fix #9 + Proposal 2: benchmark envs skip NVS + disable runtime button cycling.
; Ca 2 co so xet:
;   IGNORE_NVS_ON_BOOT=1 : boot khong load preset tu NVS.
;   ENABLE_RUNTIME_PRESETS=0 : button khong the doi preset trong session.
; -> reproducibility 100% cho A/B benchmark.
[env_bench_common]
extends = env_tc22_common
build_flags =
    ${env_tc22_common.build_flags}
    -DIGNORE_NVS_ON_BOOT=1
    -DENABLE_RUNTIME_PRESETS=0

; Daily-use env: NVS + button (khong khoa preset). Convenience for dev.
[env:tc22_daily]
extends = env_tc22_common
build_flags =
    ${env_tc22_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=3
    -DTEST_ID=9303

; Strict benchmark: khoa NVS + khoa button (reproducibility 100%).
; Fix Review#2: truoc day tc22_bench extend env_tc22_common (khong khoa)
; -> NVS overwrite preset, button van doi preset in-session.
[env:tc22_bench]
extends = env_bench_common
build_flags =
    ${env_bench_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=3
    -DTEST_ID=9303

; Baseline (Gating + Median + EMA) cho A/B
[env:tc22_baseline]
extends = env_bench_common
build_flags =
    ${env_bench_common.build_flags}
    -DESTIMATOR_MODE=EST_BASELINE
    -DTEST_ID=8002

; Raw pass-through cho fair offline benchmark (D1)
[env:tc22_raw]
extends = env_bench_common
build_flags =
    ${env_bench_common.build_flags}
    -DESTIMATOR_MODE=EST_RAW_ONLY
    -DTEST_ID=0050

; Alpha-beta variants
[env:tc22_ab_light]
extends = env_bench_common
build_flags =
    ${env_bench_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=2
    -DTEST_ID=2002

[env:tc22_ab_aggressive]
extends = env_bench_common
build_flags =
    ${env_bench_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=4
    -DTEST_ID=2004

[env:tc22_ab_handheld]
extends = env_bench_common
build_flags =
    ${env_bench_common.build_flags}
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=5
    -DTEST_ID=2005

[env:tc22_release]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DUSE_TC22
    -DENABLE_MQTT_LOG=0
    -DESTIMATOR_MODE=EST_ALPHABETA
    -DAB_PRESET_ID=3
